# @package _global_

defaults:
  - train
  - override /task: robotwin_ahawam
  - _self_

ckpt: /home/ma-user/work/dataset/cwr_wulan_model/aha-wam/checkpoints/AHA-WAM-RoboTwin2.0/robotwin_ahawam.pt
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
