# @package _global_
# =============================================================================
# SKIP_V2 EXPERIMENT — train under skip_phase v2 schedule (NOT the OFFSET experiment)
# =============================================================================
# Eval counterpart: VIDEO_DIT_MODE=skip_phase (ah64/cpp2, near=0.10, max_consec=1).
# Do not mix with task=robotwin_ahawam_offset / train_finetune_offset.sh.
# =============================================================================

defaults:
  - override /data: robotwin
  - override /model: ahawam
  - _self_

batch_size: 4
num_workers: 8
history_aware_batching: true

model:
  mot_checkpoint_mixed_attn: true
  action_dit_pretrained_path: path/to/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  # Match MAIN-2 skip_phase eval (ah64 / cpp2).
  action_horizon: 64
  action_chunk_size: 16
  max_action_offset: 0
  action_obs_downsample_factor: 1
  chunk_kv_editor_num_queries: 32
  num_history_frames: 6
  action_video_read_mode: current_only
  video_rope_frame_stride: ${data.train.action_video_freq_ratio}
  loss:
    lambda_action_prior: 1.0

data:
  train:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 65
    max_action_offset: 0
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}
    skip_phase_v2_train: true
    chunks_per_video_prefill: 2
    skip_phase_max_consecutive_skips: 1
    skip_phase_place_progress: 0.85
    num_history_frames: ${model.num_history_frames}
  val:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 65
    max_action_offset: 0
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}
    skip_phase_v2_train: true
    chunks_per_video_prefill: 2
    skip_phase_max_consecutive_skips: 1
    skip_phase_place_progress: 0.85
    num_history_frames: ${model.num_history_frames}

output_dir: path/to/checkpoints/robotwin_skip_v2/runs/train/${hydra:runtime.choices.task}-${now:%Y-%m-%d}_${now:%H-%M-%S}

wandb:
  enabled: true
  workspace: null
  project: ahawam
  name: robotwin_ahawam_skip_v2
  group: null
  mode: offline

lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 5
max_steps: null
log_every: 10
save_every: 500
eval_every: 500

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
