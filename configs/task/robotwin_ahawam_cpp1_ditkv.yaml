# @package _global_
# =============================================================================
# CPP1_DITKV ADAPT — train under cpp=1 always-refresh + Mot Video DiT/KV path
# =============================================================================
# Plan §4.2a path-3. NOT skip_v2 proxy. NOT offset. NOT success-BC.
# Eval later: ah64/cpp1 always (and cpp2 smoke check).
# =============================================================================

defaults:
  - override /data: robotwin
  - override /model: ahawam
  - _self_

batch_size: 2
num_workers: 4
history_aware_batching: true
# Forward still runs Video DiT; freeze weights (Action + extras train).
freeze_video_dit: true

model:
  mot_checkpoint_mixed_attn: true
  action_dit_pretrained_path: path/to/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  action_horizon: 64
  action_chunk_size: 16
  max_action_offset: 0
  action_obs_downsample_factor: 1
  chunk_kv_editor_num_queries: 32
  num_history_frames: 6
  action_video_read_mode: current_only
  video_rope_frame_stride: ${data.train.action_video_freq_ratio}
  loss:
    lambda_action_prior: 1.0
    # Action adapt under DiT+KV; do not retrain video denoising.
    lambda_video: 0.0

data:
  train:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 65
    max_action_offset: 0
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}
    skip_phase_v2_train: false
    cpp1_ditkv_train: true
    chunks_per_video_prefill: 1
    num_history_frames: ${model.num_history_frames}
  val:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 65
    max_action_offset: 0
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}
    skip_phase_v2_train: false
    cpp1_ditkv_train: true
    chunks_per_video_prefill: 1
    num_history_frames: ${model.num_history_frames}

output_dir: path/to/checkpoints/robotwin_cpp1_ditkv/runs/train/${hydra:runtime.choices.task}-${now:%Y-%m-%d}_${now:%H-%M-%S}

wandb:
  enabled: false
  workspace: null
  project: ahawam
  name: robotwin_ahawam_cpp1_ditkv
  group: null
  mode: offline

lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 5
max_steps: null
log_every: 10
save_every: 1000
eval_every: 1000

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
