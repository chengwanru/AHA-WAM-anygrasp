# @package _global_
# =============================================================================
# HE=8 adapt — Video Hp=64, Action chunk=8, execute 8, replan (new Video) every 8
# Not skip_v2 / offset / cpp1-only freeze. Video+Action both train.
# =============================================================================

defaults:
  - override /data: robotwin
  - override /model: ahawam
  - _self_

batch_size: 2
num_workers: 8
history_aware_batching: true
freeze_video_dit: false

model:
  mot_checkpoint_mixed_attn: true
  action_dit_pretrained_path: path/to/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  action_horizon: 64
  action_chunk_size: 8
  max_action_offset: 0
  action_obs_downsample_factor: 1
  chunk_kv_editor_num_queries: 32
  num_history_frames: 6
  action_video_read_mode: current_only
  video_rope_frame_stride: ${data.train.action_video_freq_ratio}
  loss:
    lambda_action: 1.0
    lambda_action_prior: 1.0
    lambda_video: 1.0

data:
  train:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 65
    max_action_offset: 0
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}
    skip_phase_v2_train: false
    cpp1_ditkv_train: false
    chunks_per_video_prefill: 1
    num_history_frames: ${model.num_history_frames}
  val:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 65
    max_action_offset: 0
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}
    skip_phase_v2_train: false
    cpp1_ditkv_train: false
    chunks_per_video_prefill: 1
    num_history_frames: ${model.num_history_frames}

output_dir: path/to/checkpoints/robotwin_he8/runs/train/${hydra:runtime.choices.task}-${now:%Y-%m-%d}_${now:%H-%M-%S}

wandb:
  enabled: false
  workspace: null
  project: ahawam
  name: robotwin_ahawam_he8
  group: null
  mode: offline

lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 5
max_steps: null
log_every: 10
save_every: 500
eval_every: 500

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null
